# Despliegue en Netlify (Next.js 16).
# Netlify detecta Next.js automáticamente y usa su runtime (OpenNext);
# estos valores coinciden con los que Netlify auto-configura y sirven
# también para desplegar con `netlify deploy` desde la CLI.
[build]
command = "npm run build"
publish = ".next"

# Persistencia por defecto: Netlify Blobs (store `gofun-db`), sin credenciales.
# Si se configuran TURSO_DATABASE_URL y TURSO_AUTH_TOKEN se usa Turso en su lugar.
# Recomendado en producción: GOFUN_SESION_SECRET (cadena larga y aleatoria).
