# Despliegue en Netlify (Next.js 16).
# Netlify detecta Next.js automáticamente y usa su runtime (OpenNext);
# estos valores coinciden con los que Netlify auto-configura y sirven
# también para desplegar con `netlify deploy` desde la CLI.
[build]
command = "npm run build"
publish = ".next"

# La persistencia va contra Turso (libSQL). La app NO usa el sistema de
# archivos en producción: sin estas variables arrancaría en modo local con
# SQLite, que no persiste en serverless. Configúralas en
# Site → Configuration → Environment variables:
#   TURSO_DATABASE_URL     (turso db show <bd> --url)
#   TURSO_AUTH_TOKEN       (turso db tokens create <bd>)
#   GOFUN_SESION_SECRET    (cadena larga y aleatoria)
